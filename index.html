<style>

.fbody{padding:12px 16px 16px;border-top:1px solid #334155;display:none}

.hint-box .hsub{font-size:12px;color:#334155;margin-top:6px}
.rcard{background:#1e293b;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid #334155;border-left-width:4px}

.iinfo{flex:1;min-width:120px}
.iname{font-size:15px;font-weight:700;color:#f1f5f9}
.isub{font-size:13px;color:#475569;margin-top:3px}
.locbadge{background:#0f172a;border-radius:10px;padding:9px 15px;border:1px solid #334155;flex-shrink:0;text-align:center;min-width:80px}

.expdate{font-size:11px;color:#334155}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px}

.mitem{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #0f172a}

.mitem strong{font-size:14px;color:#f1f5f9;text-align:right;font-weight:700}
.modal-footer{display:flex;gap:8px;margin-top:20px}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:14px;font-weight:600}
.btn-confirm{flex:1;padding:11px;border-radius:10px;border:none;background:#ef4444;color:#fff;cursor:pointer;font-size:14px;font-weight:700}

.modal-note{font-size:12px;color:#475569;margin-top:12px;text-align:center;line-height:1.6}
.detail{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:2px solid #0ea5e9;border-radius:20px 20px 0 0;padding:20px;z-index:100;max-height:55vh;overflow-y:auto;box-shadow:0 -8px 32px rgba(0,0,0,.6);display:none}

.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.dcode{font-family:monospace;font-size:15px;font-weight:800;color:#38bdf8;letter-spacing:1px}
.dname{margin-left:10px;font-size:13px;color:#f1f5f9;font-weight:600}
.dclose{background:none;border:none;color:#64748b;cursor:pointer;font-size:20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ditem{background:#0f172a;border-radius:8px;padding:10px 12px}
.dlabel{font-size:10px;color:#475569;margin-bottom:3px}
.dval{font-size:13px;color:#f1f5f9;font-weight:600;word-break:break-all}
.icard{background:#1e293b;border-radius:12px;padding:18px 16px;margin-bottom:14px;border:1px solid #334155}
.istep-label{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.istep-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#0ea5e9;color:#fff;font-size:11px;font-weight:800;flex-shrink:0}
.iresult-item{background:#0f172a;border-radius:10px;padding:13px 15px;margin-bottom:8px;border-left:3px solid #0ea5e9}
.idonor-txt{font-family:monospace;font-size:18px;font-weight:800;color:#38bdf8;letter-spacing:2px}
.iitem-name{font-size:14px;font-weight:700;color:#f1f5f9;margin-top:5px}
.iitem-sub{font-size:12px;color:#475569;margin-top:3px}
.itag{font-size:12px;padding:3px 10px;border-radius:10px;display:inline-block;margin-top:8px;margin-right:4px}
.btn-isearch{padding:10px 0;border-radius:10px;border:none;background:#0ea5e9;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;width:100%;max-width:320px;display:block}
.fchip{padding:8px 14px;border-radius:20px;border:1.5px solid #334155;cursor:pointer;font-size:13px;font-weight:700;background:#0f172a;color:#94a3b8;transition:all .15s;white-space:nowrap}
.fchip.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.zone-input{width:100%;max-width:300px;padding:11px 16px;border-radius:10px;border:2px solid #334155;background:#0f172a;color:#f1f5f9;font-size:15px;font-family:monospace;outline:none;transition:border-color .2s;margin-top:8px;letter-spacing:2px}
.zone-input:focus{border-color:#0ea5e9}
.btn-intake-confirm{width:100%;padding:14px;border-radius:10px;border:none;background:#22c55e;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-top:16px;transition:background .15s}
.btn-intake-confirm:hover{background:#16a34a}
.btn-intake-confirm:disabled{background:#14532d;color:#4ade8060;cursor:not-allowed}
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>🧊 냉동창고 조직 현황</h1>
    <div class="header-sub">인체조직 냉동고 · 구글시트 실시간 연동</div>
  </div>
  <div class="header-right">
    <span class="updated" id="updated"></span>
    <button class="btn-refresh" onclick="loadData()">↺ 새로고침</button>
  </div>
</div>

<div class="center-box" id="loading">
  <span class="spin">🧊</span>
  <div style="color:#94a3b8;font-size:14px">데이터 불러오는 중...</div>
</div>
<div class="center-box" id="errbox" style="display:none">
  <div style="font-size:32px">⚠️</div>
  <div style="color:#94a3b8;font-size:14px">데이터를 불러올 수 없어요</div>
  <div class="err-msg" id="errmsg"></div>
  <button class="btn-retry" onclick="loadData()">다시 시도</button>
</div>

<div id="dash" style="display:none">
  <div class="tab-nav">
    <button class="tabn active" id="tabStatus" onclick="setTab('status')">📊 현황</button>
    <button class="tabn" id="tabIntake" onclick="setTab('intake')">📥 입고<span class="tbadge" id="nostoreBadge" style="display:none">0</span></button>
  </div>
  <div class="wrap">
    <div id="pageStatus">
      <div class="summary" id="summary"></div>
      <div class="fridge-sec">
        <div class="sec-title">🧊 냉동고별 보관 현황</div>
        <div class="fridge-grid" id="fridgeGrid"></div>
        <div class="legend">
          <span><span class="ldot" style="background:#22c55e"></span><span class="ltxt">여유</span></span>
          <span><span class="ldot" style="background:#f59e0b"></span><span class="ltxt">보통</span></span>
          <span><span class="ldot" style="background:#ef4444"></span><span class="ltxt">만료있음</span></span>
          <span class="ltxt" style="margin-left:auto">클릭 시 필터</span>
        </div>
      </div>
      <div class="search-sec">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap">
          <div class="slabel" style="margin-bottom:0">조직번호 검색</div>
          <div style="display:flex;gap:6px">
            <button onclick="setMode('single')" id="mSingle" style="padding:4px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:#0ea5e9;color:#fff">1개 검색</button>
            <button onclick="setMode('multi')" id="mMulti" style="padding:4px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:700;background:#0f172a;color:#475569">여러 개 검색</button>
          </div>
        </div>
        <div id="modeSingle">
          <div class="search-wrap">
            <input class="sinput" id="sinput" type="text" maxlength="6" placeholder="예: 252001" oninput="onSearch(this)" onkeyup="render()">
            <span class="scnt" id="scnt">0/6</span>
          </div>
        </div>
        <div id="modeMulti" style="display:none">
          <textarea id="multiInput" placeholder="여러 개 붙여넣기 (줄바꿈 또는 쉼표로 구분)&#10;예: 261191&#10;261192&#10;261193" oninput="render()"
            style="width:100%;max-width:420px;height:130px;padding:10px 14px;border-radius:10px;border:2px solid #334155;background:#1e293b;color:#f1f5f9;font-size:14px;font-family:monospace;letter-spacing:1px;outline:none;resize:vertical;line-height:1.9"></textarea>
          <div style="display:flex;gap:8px;margin-top:6px;align-items:center">
            <button onclick="document.getElementById('multiInput').value='';render()" style="padding:6px 14px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:12px;cursor:pointer">초기화</button>
            <span id="multiCount" style="font-size:11px;color:#475569"></span>
          </div>
        </div>
      </div>
      <div class="filter-sec">
        <button class="ftoggle" onclick="toggleFilter()">
          <span>🔽 필터 선택 <span class="badge" id="fbadge" style="display:none"></span></span>
          <span id="farrow" style="font-size:11px;color:#475569">▼</span>
        </button>
        <div class="fbody" id="fbody">
          <div class="fgroup"><div class="fglabel">품목 구분</div><div class="chips" id="cType"></div></div>
          <div class="fgroup"><div class="fglabel">냉동고</div><div class="chips" id="cFridge"></div></div>
          <div class="fgroup"><div class="fglabel">유효기간</div><div class="chips" id="cExp"></div></div>
        </div>
      </div>
      <div class="rhead"><div class="rcnt" id="rcnt"></div><div class="rlocs" id="rlocs"></div></div>
      <div class="rlist" id="rlist"></div>
    </div>

    <div id="pageIntake" style="display:none">
      <div class="icard">
        <div class="istep-label"><span class="istep-num">1</span> 기증자번호 입력</div>
        <div class="search-wrap">
          <input class="sinput" id="iinput" type="text" maxlength="6" placeholder="예: 262478" oninput="onISearch(this)">
          <span class="scnt" id="iscnt">0/6</span>
        </div>
        <button class="btn-isearch" onclick="searchIntake()">🔍 검색</button>
      </div>
      <div class="icard" id="iResultCard" style="display:none">
        <div class="istep-label"><span class="istep-num">2</span> 입고 대상 확인</div>
        <div id="iItems"></div>
      </div>
      <div class="icard" id="iFridgeCard" style="display:none">
        <div class="istep-label"><span class="istep-num">3</span> 냉동고 선택</div>
        <div class="chips" id="iFridgeChips" style="gap:8px"></div>
        <div class="istep-label" style="margin-top:18px">
          <span class="istep-num">4</span> 보관 구역 입력
          <span style="font-weight:400;font-size:10px;margin-left:4px;text-transform:none">(선택사항)</span>
        </div>
        <input class="zone-input" id="iZone" type="text" placeholder="예: 2구역, A-3">
        <button class="btn-intake-confirm" id="btnIntakeConfirm" onclick="confirmIntake()" disabled>✅ 입고 확인</button>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">📦 출고 처리</div>
    <div id="modalBody"></div>
    <div class="modal-note" id="modalNote"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" id="btnConfirm" onclick="confirmRelease()">출고 확인</button>
    </div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="dhead">
    <div><span class="dcode" id="dcode"></span><span class="dname" id="dname"></span></div>
    <button class="dclose" onclick="closeDetail()">×</button>
  </div>
  <div class="dgrid" id="dgrid"></div>
</div>

<script>
const SHEET_ID="1I7PREqlH4XFSZDdIBM9mEvyE7nQRzU3SeDlomqkVox0";
const GID="1504643023";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbxZkioH8mw-Ee2ZQkAoeSsNkydkjMIR8M1kqCY-NQMmhuqjKmj3C2A-U2c9D66tM4AG/exec";

let ALL=[],STOCK=[],NOSTORED=[];
let selType=[],selFridge=[],selExp=[];
const EXP_OPTS=["만료","90일이내","정상"];
let filterOpen=false,openCard=null,releaseItem=null;

const TODAY=new Date();
function daysDiff(s){if(!s)return 9999;return Math.ceil((new Date(s)-TODAY)/86400000);}
function expStatus(s){const d=daysDiff(s);if(d<0)return{label:"만료",color:"#ef4444"};if(d<=90)return{label:"90일이내",color:"#f59e0b"};return{label:"정상",color:"#22c55e"};}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function setTab(tab){
  document.getElementById('tabStatus').classList.toggle('active',tab==='status');
  document.getElementById('tabIntake').classList.toggle('active',tab==='intake');
  document.getElementById('pageStatus').style.display=tab==='status'?'':'none';
  document.getElementById('pageIntake').style.display=tab==='intake'?'':'none';
}

function loadData(){
  show("loading");hide("errbox");hide("dash");
  Papa.parse(CSV_URL+"&t="+Date.now(),{
    download:true,header:true,skipEmptyLines:true,
    complete:function(res){
      ALL=res.data;
      STOCK=ALL.filter(r=>!r["출고일자"]||r["출고일자"].trim()==="");
      NOSTORED=ALL.filter(r=>(!r["출고일자"]||r["출고일자"].trim()==="")&&(!r["냉동고번호"]||r["냉동고번호"].trim()===""));
      document.getElementById("updated").textContent=new Date().toLocaleTimeString("ko-KR")+" 기준";
      const nb=document.getElementById('nostoreBadge');
      if(NOSTORED.length>0){nb.textContent=NOSTORED.length;nb.style.display='';}else nb.style.display='none';
      buildAll();hide("loading");show("dash");
    },
    error:function(e){document.getElementById("errmsg").textContent=e.message||"CSV 로드 실패";hide("loading");show("errbox");}
  });
}

function buildAll(){buildSummary();buildFridges();buildChips();render();}

function buildSummary(){
  const expired=STOCK.filter(r=>daysDiff(r["유효기간"])<0).length;
  const fridges=[...new Set(STOCK.map(r=>r["냉동고번호"]).filter(Boolean))];
  let h=`<div class="scard" style="border-color:#38bdf822"><div class="ico">📦</div><div class="val" style="color:#38bdf8">${STOCK.length}</div><div class="lbl">현재 보관 재고</div><div class="sub">출고완료 ${ALL.length-STOCK.length}건 제외</div></div>
  <div class="scard" style="border-color:#22c55e22"><div class="ico">🧊</div><div class="val" style="color:#22c55e">${fridges.length}<span style="font-size:13px;font-weight:400;color:#475569">대</span></div><div class="lbl">사용 중 냉동고</div></div>`;
  if(NOSTORED.length>0)h+=`<div class="scard click" style="background:#0a1628;border-color:#3b82f655" onclick="setTab('intake')"><div class="ico">📥</div><div class="val" style="color:#3b82f6">${NOSTORED.length}</div><div class="lbl">입고 미배정</div><div class="sub">클릭 시 입고 탭</div></div>`;
  if(expired>0)h+=`<div class="scard click" style="background:#1f0a0a;border-color:#ef444455" onclick="setExp('만료')"><div class="ico">🚨</div><div class="val" style="color:#ef4444">${expired}</div><div class="lbl">유효기간 만료</div><div class="sub">클릭 시 필터</div></div>`;
  document.getElementById("summary").innerHTML=h;
}

function buildFridges(){
  const list=[...new Set(STOCK.map(r=>r["냉동고번호"]).filter(Boolean))].sort();
  document.getElementById("fridgeGrid").innerHTML=list.map(f=>{
    const rows=STOCK.filter(r=>r["냉동고번호"]===f);
    const exp=rows.filter(r=>daysDiff(r["유효기간"])<0).length;
    const c=exp>0?"#ef4444":rows.length>15?"#f59e0b":"#22c55e";
    return `<div class="fcard${exp>0?" expired":""}" id="fc_${f}" onclick="toggleFridge('${f}')"><div class="fid">${f}</div><div class="fcnt" style="color:${c}">${rows.length}</div><div class="funit">건</div>${exp>0?`<div class="fexp">만료 ${exp}건</div>`:""}</div>`;
  }).join("");
}

function buildChips(){
  const types=[...new Set(STOCK.map(r=>r["품목구분"]).filter(Boolean))];
  const fridges=[...new Set(STOCK.map(r=>r["냉동고번호"]).filter(Boolean))].sort();
  rc("cType",["전체",...types],selType,"#3b82f6",toggleType);
  rc("cFridge",["전체",...fridges],selFridge,"#8b5cf6",toggleFridge2);
  rc("cExp",["전체",...EXP_OPTS],selExp,"#10b981",toggleExp);
  const n=selType.length+selFridge.length+selExp.length;
  const b=document.getElementById("fbadge");
  b.style.display=n>0?"inline":"none";b.textContent=n+"개 적용";
}

function rc(id,opts,sel,color,fn){
  document.getElementById(id).innerHTML=opts.map(o=>{
    const on=o==="전체"?sel.length===0:sel.includes(o);
    return `<button class="chip${on?" on":""}" style="${on?`color:#fff;background:${color};outline-color:${color}`:""}" onclick="${fn.name}('${o}')">${o}</button>`;
  }).join("");
}

function toggleType(v){tog(selType,v);buildChips();render();}
function toggleFridge2(v){tog(selFridge,v);updateFCards();buildChips();render();}
function toggleExp(v){tog(selExp,v);buildChips();render();}
function toggleFridge(f){tog(selFridge,f);updateFCards();buildChips();render();}
function setExp(v){selExp=[v];selType=[];selFridge=[];buildChips();updateFCards();render();}
function tog(arr,v){if(v==="전체"){arr.length=0;return;}const i=arr.indexOf(v);i>=0?arr.splice(i,1):arr.push(v);}
function updateFCards(){document.querySelectorAll(".fcard").forEach(el=>{el.classList.toggle("on",selFridge.includes(el.id.replace("fc_","")));});}
function toggleFilter(){filterOpen=!filterOpen;document.getElementById("fbody").classList.toggle("open",filterOpen);document.getElementById("farrow").textContent=filterOpen?"▲":"▼";}

let searchMode='single';
function setMode(m){
  searchMode=m;
  document.getElementById("modeSingle").style.display=m==='single'?'':'none';
  document.getElementById("modeMulti").style.display=m==='multi'?'':'none';
  document.getElementById("mSingle").style.background=m==='single'?'#0ea5e9':'#0f172a';
  document.getElementById("mSingle").style.color=m==='single'?'#fff':'#475569';
  document.getElementById("mMulti").style.background=m==='multi'?'#0ea5e9':'#0f172a';
  document.getElementById("mMulti").style.color=m==='multi'?'#fff':'#475569';
  if(m==='single'){document.getElementById("sinput").value='';document.getElementById("scnt").textContent='0/6';}
  else document.getElementById("multiInput").value='';
  render();
}
function onSearch(el){el.value=el.value.replace(/\D/g,"").slice(0,6);const c=document.getElementById("scnt");c.textContent=el.value.length+"/6";c.className="scnt"+(el.value.length===6?" on":"");}
function getMultiCodes(){const raw=document.getElementById("multiInput").value;return[...new Set(raw.split(/[\n,\s]+/).map(s=>s.replace(/\D/g,"").trim()).filter(s=>s.length>=4))];}
function groupByDonor(rows){const map=new Map();rows.forEach(r=>{const donor=String(r["기증자번호"]||"").trim();if(!map.has(donor))map.set(donor,[]);map.get(donor).push(r);});return[...map.values()];}

function copyCode(code,e){
  e.stopPropagation();const btn=e.currentTarget;
  const ok=()=>{btn.textContent="✓";btn.classList.add("copied");setTimeout(()=>{btn.textContent="📋";btn.classList.remove("copied");},1200);};
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(ok).catch(()=>fbCopy(code,ok));else fbCopy(code,ok);
}
function fbCopy(text,cb){const ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb();}

function openRelease(i,e){
  e.stopPropagation();
  const group=_list[i];const r=group[0];
  releaseItem={donor:String(r["기증자번호"]||"").trim(),count:group.length,rows:group};
  const floor=String(r["냉동고 보관 구역"]||"").trim();
  const today=todayStr();
  document.getElementById("modalBody").innerHTML=`
    <div class="mitem"><span>기증자번호</span><strong style="color:#38bdf8;font-family:monospace;font-size:16px">${releaseItem.donor||"—"}</strong></div>
    <div class="mitem"><span>품목명</span><strong>${r["품목명"]||"—"}</strong></div>
    <div class="mitem"><span>냉동고</span><strong style="color:#fbbf24">${r["냉동고번호"]||"—"}${floor?" · "+floor+"구역":""}</strong></div>
    <div class="mitem"><span>출고 수량</span><strong style="color:#a78bfa">${group.length}건 (전체 출고)</strong></div>
    <div class="mitem"><span>출고일자 (S열)</span><strong style="color:#22c55e">${today}</strong></div>
    <div class="mitem"><span>비고 (T열)</span><strong>이다빈</strong></div>`;
  document.getElementById("modalNote").textContent=`기증자번호 ${releaseItem.donor}의 ${group.length}건이 모두 출고 처리됩니다.`;
  document.getElementById("btnConfirm").disabled=false;
  document.getElementById("modalOverlay").style.display="flex";
}
function closeModal(){document.getElementById("modalOverlay").style.display="none";releaseItem=null;const btn=document.getElementById("btnConfirm");btn.disabled=false;btn.textContent="출고 확인";}
async function confirmRelease(){
  if(!releaseItem)return;
  const donor=releaseItem.donor;
  const btn=document.getElementById("btnConfirm");
  btn.disabled=true;btn.textContent="처리 중...";
  const today=todayStr();
  try{
    const url=`${APPS_SCRIPT_URL}?donorCode=${encodeURIComponent(donor)}&date=${encodeURIComponent(today)}&t=${Date.now()}`;
    const res=await fetch(url,{redirect:'follow'});
    const data=await res.json();
    if(data.success){closeModal();alert(`✅ 출고 완료!\n기증자번호: ${donor}\n출고일자: ${today}\n비고: 이다빈\n처리: ${data.updated}건`);setTimeout(loadData,1500);}
    else{alert("❌ 출고 실패: "+(data.error||"알 수 없는 오류"));btn.disabled=false;btn.textContent="출고 확인";}
  }catch(err){alert("❌ 연결 실패\n"+err.message);btn.disabled=false;btn.textContent="출고 확인";}
}

function render(){
  let code='',codes=[];
  if(searchMode==='single'){code=document.getElementById("sinput").value.trim();}
  else{codes=getMultiCodes();const mc=document.getElementById("multiCount");mc.textContent=codes.length>0?`${codes.length}개 코드 입력됨`:'';}
  const hasF=code||codes.length||selType.length||selFridge.length||selExp.length;
  if(!hasF){
    document.getElementById("rcnt").innerHTML="";document.getElementById("rlocs").textContent="";
    document.getElementById("rlist").innerHTML=`<div class="hint-box"><div class="hico">🔍</div><div class="htxt">조직번호를 입력하거나<br>필터·냉동고를 선택하면 결과가 표시됩니다</div><div class="hsub">총 ${STOCK.length}건 보관 중</div></div>`;
    _list=[];return;
  }
  let pool=STOCK;
  if(codes.length>0){pool=STOCK.filter(r=>{const donor=String(r["기증자번호"]||"").trim();const org=String(r["조직번호"]||"").trim();return codes.some(c=>org.startsWith(c)||donor===c);});}
  let filtered=pool.filter(r=>{
    if(code&&!String(r["조직번호"]||"").startsWith(code))return false;
    if(selType.length&&!selType.includes(r["품목구분"]))return false;
    if(selFridge.length&&!selFridge.includes(r["냉동고번호"]))return false;
    if(selExp.length&&!selExp.includes(expStatus(r["유효기간"]).label))return false;
    return true;
  });
  const groups=groupByDonor(filtered).sort((a,b)=>{
    const pa=["만료","90일이내","정상"].indexOf(expStatus(a[0]["유효기간"]).label);
    const pb=["만료","90일이내","정상"].indexOf(expStatus(b[0]["유효기간"]).label);
    return pa-pb;
  });
  document.getElementById("rcnt").innerHTML=`<strong>${groups.length}건</strong> 검색됨`;
  const locs=[...new Set(filtered.map(r=>r["냉동고번호"]).filter(Boolean))].sort();
  document.getElementById("rlocs").textContent=locs.join(" · ");
  if(!groups.length){document.getElementById("rlist").innerHTML=`<div class="empty"><div style="font-size:32px;margin-bottom:8px">🔍</div>조건에 맞는 조직이 없습니다</div>`;_list=[];return;}
  document.getElementById("rlist").innerHTML=groups.map((group,i)=>{
    const r=group[0];const exp=expStatus(r["유효기간"]);const d=daysDiff(r["유효기간"]);
    const donor=String(r["기증자번호"]||"").trim()||String(r["조직번호"]||"").slice(0,6);
    const floor=String(r["냉동고 보관 구역"]||"").trim();const cnt=group.length;
    return `<div class="rcard" style="border-left-color:${exp.color}" id="rc${i}" onclick="toggleCard(${i})">
      <div class="codebadge">${donor||"—"}</div>
      <div class="iinfo"><div class="iname">${r["품목명"]||"—"}</div><div class="isub">${r["품목구분"]||""} ${r["규격1"]?`· ${r["규격1"]}`:""}</div></div>
      ${r["냉동고번호"]?`<div class="locbadge"><div class="loclabel">냉동고</div><div class="locval">${r["냉동고번호"]}</div>${floor?`<div class="locfloor">${floor}구역</div>`:""}</div>`:""}
      ${cnt>1?`<div class="itembadge"><div class="itemlabel">수량</div><div class="itemval">${cnt}건</div></div>`:""}
      <div class="expbadge"><span class="exptag" style="background:${exp.color}22;color:${exp.color}">${exp.label}</span><br><span class="expdays">${d<0?Math.abs(d)+"일 초과":d+"일 남음"}</span><br><span class="expdate">${r["유효기간"]||""}</span></div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="btn-copy" onclick="copyCode('${donor}',event)">📋</button>
        <button class="btn-release" onclick="openRelease(${i},event)">출고</button>
      </div>
    </div>`;
  }).join("");
  _list=groups;
}
let _list=[];

function toggleCard(i){
  if(openCard===i){closeDetail();return;}
  openCard=i;
  document.querySelectorAll(".rcard").forEach(el=>el.classList.remove("open"));
  document.getElementById("rc"+i)?.classList.add("open");
  const group=_list[i];const r=group[0];
  const floor=String(r["냉동고 보관 구역"]||"").trim();
  document.getElementById("dcode").textContent=String(r["기증자번호"]||r["조직번호"]||"").slice(0,6)||"—";
  document.getElementById("dname").textContent=r["품목명"]||"";
  const fields=[["📍 냉동고",r["냉동고번호"]||"—"],["🗂 보관구역",floor||"—"],["📦 수량",group.length+"건"],["📋 품목구분",r["품목구분"]||"—"],["📏 규격",`${r["규격1"]||""} ${r["규격2"]||""}`.trim()||"—"],["📅 입고일",r["입고일자"]||"—"],["⏰ 유효기간",r["유효기간"]||"—"],["🔖 기증자번호",r["기증자번호"]||"—"],["🏷 바코드",r["바코드번호"]||"—"],["📝 비고",r["비고"]||"—"]];
  document.getElementById("dgrid").innerHTML=fields.map(([k,v])=>`<div class="ditem"><div class="dlabel">${k}</div><div class="dval">${v}</div></div>`).join("");
  document.getElementById("detail").classList.add("open");
}
function closeDetail(){openCard=null;document.querySelectorAll(".rcard").forEach(el=>el.classList.remove("open"));document.getElementById("detail").classList.remove("open");}

let iSelectedFridge='',iFoundGroups=[];
function onISearch(el){
  el.value=el.value.replace(/\D/g,"").slice(0,6);
  const c=document.getElementById('iscnt');c.textContent=el.value.length+'/6';c.className='scnt'+(el.value.length===6?' on':'');
  if(el.value.length===6)searchIntake();
}
function searchIntake(){
  const code=document.getElementById('iinput').value.trim();
  if(!code||code.length<4){alert('기증자번호를 입력해주세요 (최소 4자리)');return;}
  const matched=NOSTORED.filter(r=>{const donor=String(r["기증자번호"]||"").trim();const org=String(r["조직번호"]||"").trim();return donor===code||org.startsWith(code);});
  iFoundGroups=groupByDonor(matched);
  const resultCard=document.getElementById('iResultCard');const fridgeCard=document.getElementById('iFridgeCard');
  if(iFoundGroups.length===0){
    document.getElementById('iItems').innerHTML=`<div style="text-align:center;padding:16px;color:#475569"><div style="font-size:28px;margin-bottom:8px">🔍</div><div style="font-size:14px">냉동고 미배정 건이 없어요</div><div style="font-size:12px;margin-top:4px;color:#334155">이미 입고 완료됐거나 번호가 없어요</div></div>`;
    resultCard.style.display='';fridgeCard.style.display='none';return;
  }
  document.getElementById('iItems').innerHTML=iFoundGroups.map(group=>{
    const r=group[0];const donor=String(r["기증자번호"]||"").trim();const exp=expStatus(r["유효기간"]);
    return `<div class="iresult-item"><div class="idonor-txt">${donor}</div><div class="iitem-name">${r["품목명"]||"—"}</div><div class="iitem-sub">${r["품목구분"]||""} ${r["규격1"]?"· "+r["규격1"]:""}</div><span class="itag" style="background:${exp.color}22;color:${exp.color}">${exp.label}</span><span class="itag" style="background:#0ea5e920;color:#0ea5e9">${group.length}건</span><span class="itag" style="background:#33415533;color:#64748b">유효기간 ${r["유효기간"]||"—"}</span></div>`;
  }).join('');
  resultCard.style.display='';buildIFridgeChips();fridgeCard.style.display='';
}
function buildIFridgeChips(){
  iSelectedFridge='';document.getElementById('btnIntakeConfirm').disabled=true;
  const fridges=[...new Set(STOCK.map(r=>r["냉동고번호"]).filter(Boolean))].sort();
  document.getElementById('iFridgeChips').innerHTML=fridges.map(f=>{
    const safe=f.replace(/[^a-zA-Z0-9]/g,'_');
    return `<button class="fchip" id="ifchip_${safe}" onclick="selectIFridge('${f}')">${f}</button>`;
  }).join('');
}
function selectIFridge(f){
  iSelectedFridge=f;
  document.querySelectorAll('.fchip').forEach(el=>el.classList.remove('on'));
  document.getElementById('ifchip_'+f.replace(/[^a-zA-Z0-9]/g,'_'))?.classList.add('on');
  document.getElementById('btnIntakeConfirm').disabled=false;
}
async function confirmIntake(){
  if(!iSelectedFridge||iFoundGroups.length===0)return;
  const donor=String(iFoundGroups[0][0]["기증자번호"]||"").trim();
  const zone=document.getElementById('iZone').value.trim();
  const btn=document.getElementById('btnIntakeConfirm');
  btn.disabled=true;btn.textContent='처리 중...';
  try{
    const url=`${APPS_SCRIPT_URL}?fridge=${encodeURIComponent(iSelectedFridge)}&donorCode=${encodeURIComponent(donor)}&zone=${encodeURIComponent(zone)}&t=${Date.now()}`;
    const res=await fetch(url,{redirect:'follow'});
    const data=await res.json();
    if(data.success){
      alert(`✅ 입고 완료!\n기증자번호: ${donor}\n냉동고: ${iSelectedFridge}${zone?"\n보관구역: "+zone:""}\n처리: ${data.updated}건`);
      document.getElementById('iinput').value='';document.getElementById('iscnt').textContent='0/6';
      document.getElementById('iZone').value='';document.getElementById('iResultCard').style.display='none';
      document.getElementById('iFridgeCard').style.display='none';
      iFoundGroups=[];iSelectedFridge='';setTimeout(loadData,1500);
    }else{alert('❌ 입고 실패: '+(data.error||'알 수 없는 오류'));btn.disabled=false;btn.textContent='✅ 입고 확인';}
  }catch(err){alert('❌ 연결 실패\n'+err.message);btn.disabled=false;btn.textContent='✅ 입고 확인';}
}

function show(id){document.getElementById(id).style.display='';}
function hide(id){document.getElementById(id).style.display='none';}
loadData();
</script>
</body>
</html>
