<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;background:#f4f4f1;color:#1f1f1e;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #e3e3de;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}

.spin{font-size:36px;animation:spin 1.5s linear infinite}

.bar{flex:1;height:8px;background:#efefeb;border-radius:4px;overflow:hidden;display:flex}

.cnt{width:56px;text-align:right;color:#9a9a94;font-size:12px}
.arw{width:14px;color:#b4b2a9;font-size:11px}
.pill{font-size:11px;padding:2px 9px;border-radius:10px;display:inline-block;text-align:center;font-weight:600}
.p-danger{background:#fceaea;color:#a32d2d}.p-warn{background:#faeeda;color:#854f0b}
.p-ok{background:#eaf3de;color:#3b6d11}.p-idle{background:#efefeb;color:#9a9a94}

.zone{margin-bottom:11px}
.zone:last-child{margin-bottom:0}
.zone-h{font-size:12px;font-weight:700;color:#185fa5;margin-bottom:5px;display:flex;justify-content:space-between}
.zrow{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 0;border-bottom:1px dashed #e7e7e2}
.zrow:last-child{border-bottom:none}
.zd{font-family:monospace;font-weight:700;width:58px;color:#185fa5}
.zn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3d3d3a}
.zc{width:34px;text-align:right;color:#6b6b66}
.search-wrap{position:relative;max-width:320px}
.sinput{width:100%;padding:11px 44px 11px 16px;border-radius:10px;border:1px solid #d6d6d0;background:#fff;font-size:16px;font-family:monospace;font-weight:700;letter-spacing:4px;outline:none;color:#1f1f1e}

.rlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rcard{background:#fff;border:1px solid #e3e3de;border-left-width:4px;border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap;cursor:pointer}

.codebadge{background:#f4f4f1;border-radius:8px;padding:8px 13px;font-family:monospace;font-size:16px;font-weight:700;color:#185fa5;letter-spacing:1px}
.iinfo{flex:1;min-width:130px}
.iname{font-size:14px;font-weight:600}
.isub{font-size:12px;color:#8a8a84;margin-top:2px}
.locbadge{background:#f4f4f1;border-radius:8px;padding:7px 12px;text-align:center;min-width:76px}
.loclabel{font-size:10px;color:#9a9a94}
.locval{font-size:16px;font-weight:700;color:#854f0b}
.locfloor{font-size:11px;color:#6b6b66;margin-top:2px}
.expbadge{text-align:right}
.expdays{font-size:11px;color:#8a8a84;display:block;margin-top:2px}
.expdate{font-size:10px;color:#b4b2a9}
.btn-copy{padding:6px 10px;border-radius:8px;border:1px solid #d6d6d0;background:#fff;color:#6b6b66;cursor:pointer;font-size:14px;line-height:1}

.hint-box{text-align:center;padding:40px 20px;border:1px dashed #d6d6d0;border-radius:12px;color:#9a9a94;font-size:14px;line-height:1.9}
.empty{text-align:center;padding:40px;color:#b4b2a9}
.hrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eeeee9;font-size:13px}
.hrow:last-child{border-bottom:none}
.hcode{font-family:monospace;font-weight:600;width:62px}
.hmid{flex:1;color:#6b6b66;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdate{color:#9a9a94;font-size:12px;white-space:nowrap}
.dist-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin-bottom:10px}

.dot{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:14px;padding:22px;max-width:380px;width:100%;border:1px solid #e3e3de}
.modal-title{font-size:16px;font-weight:700;margin-bottom:14px}
.mitem{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f0f0ec}
.mitem span{font-size:13px;color:#8a8a84}
.mitem strong{font-size:13px;text-align:right;font-weight:600}
.modal-footer{display:flex;gap:8px;margin-top:18px}
.btn-cancel{flex:1;padding:11px;border-radius:10px;border:1px solid #d6d6d0;background:#fff;color:#6b6b66;cursor:pointer;font-size:14px;font-weight:600}
.btn-confirm{flex:1;padding:11px;border-radius:10px;border:none;background:#e24b4a;color:#fff;cursor:pointer;font-size:14px;font-weight:700}
.btn-confirm:disabled{background:#f0999 5;background:#f09595;cursor:not-allowed}
.modal-note{font-size:12px;color:#8a8a84;margin-top:10px;text-align:center;line-height:1.6}
.detail{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #185fa5;border-radius:16px 16px 0 0;padding:18px 20px;z-index:100;max-height:55vh;overflow-y:auto;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.12)}
.detail.open{display:block}
.dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dcode{font-family:monospace;font-size:15px;font-weight:700;color:#185fa5}
.dname{margin-left:10px;font-size:13px;font-weight:600}
.dclose{background:none;border:none;color:#9a9a94;cursor:pointer;font-size:20px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ditem{background:#f9f9f7;border-radius:8px;padding:9px 11px}
.dlabel{font-size:10px;color:#9a9a94;margin-bottom:2px}
.dval{font-size:13px;font-weight:600;word-break:break-all}
.icard{background:#fff;border:1px solid #e3e3de;border-radius:12px;padding:16px;margin-bottom:14px}
.istep{font-size:12px;font-weight:700;color:#6b6b66;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.istep-num{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#185fa5;color:#fff;font-size:11px;font-weight:700}
.iresult{background:#f9f9f7;border-radius:10px;padding:12px 14px;margin-bottom:8px;border-left:3px solid #185fa5}
.idonor{font-family:monospace;font-size:17px;font-weight:700;color:#185fa5}
.iname2{font-size:14px;font-weight:600;margin-top:4px}
.isub2{font-size:12px;color:#8a8a84;margin-top:2px}
.itag{font-size:11px;padding:3px 9px;border-radius:10px;display:inline-block;margin-top:7px;margin-right:4px;font-weight:600}
.btn-isearch{padding:10px 0;border-radius:10px;border:none;background:#185fa5;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px;width:100%;max-width:320px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{padding:8px 14px;border-radius:20px;border:1px solid #d6d6d0;cursor:pointer;font-size:13px;font-weight:700;background:#fff;color:#6b6b66}
.fchip.on{background:#185fa5;color:#fff;border-color:#185fa5}
.fchip:disabled{opacity:.4;cursor:not-allowed}
.zone-input{width:100%;max-width:300px;padding:11px 16px;border-radius:10px;border:1px solid #d6d6d0;background:#fff;font-size:15px;font-family:monospace;outline:none;margin-top:8px;color:#1f1f1e}
.zone-input:focus{border-color:#185fa5}
.btn-intake{width:100%;padding:13px;border-radius:10px;border:none;background:#639922;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px}
.btn-intake:disabled{background:#c0dd97;cursor:not-allowed}
.filter-sec{background:#fff;border:1px solid #e3e3de;border-radius:12px;margin-bottom:14px;overflow:hidden}
.ftoggle{width:100%;padding:11px 16px;background:none;border:none;cursor:pointer;display:flex;justify-content:space-between;font-size:13px;color:#1f1f1e}
.fbody{padding:12px 16px 16px;border-top:1px solid #eeeee9;display:none}
.fbody.open{display:block}
.fgroup{margin-bottom:12px}
.fglabel{font-size:11px;color:#8a8a84;font-weight:700;margin-bottom:6px}
.chip{padding:5px 12px;border-radius:20px;border:1px solid #e3e3de;cursor:pointer;font-size:12px;background:#fff;color:#6b6b66}
.chip.on{color:#fff}
.badge{background:#185fa5;color:#fff;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px}
</style>
</head>
<body>
<div class="header">
  <div class="hl">
    <img src="logo.png" class="logo-img" alt="CGBIO" onerror="this.style.display='none';document.querySelector('.logo-txt').style.display='block'">
    <span class="logo-txt">CGBIO</span>
    <div class="hdiv"></div>
    <div>
      <h1>냉동창고 조직 현황</h1>
      <div class="header-sub">SCM 물류팀 · 인체조직 원재료</div>
    </div>
  </div>
  <div class="header-right">
    <span class="mode-tag" id="modeTag"></span>
    <span class="updated" id="updated"></span>
    <button class="btn-refresh" onclick="loadData()">↺ 새로고침</button>
  </div>
</div>

<div class="center-box" id="loading"><span class="spin">🧊</span><div style="color:#8a8a84;font-size:14px">데이터 불러오는 중...</div></div>
<div class="center-box" id="errbox" style="display:none">
  <div style="font-size:32px">⚠️</div><div style="color:#8a8a84;font-size:14px">데이터를 불러올 수 없어요</div>
  <div class="err-msg" id="errmsg"></div><button class="btn-retry" onclick="loadData()">다시 시도</button>
</div>

<div id="dash" style="display:none">
  <div class="tab-nav">
    <button class="tabn active" id="tabStatus" onclick="setTab('status')">현황</button>
    <button class="tabn" id="tabIntake" onclick="setTab('intake')">입고</button>
    <button class="tabn" id="tabOut" onclick="setTab('out')">출고</button>
  </div>
  <div class="wrap">

    <div id="pageStatus">
      <div id="alertBox"></div>
      <div class="metrics" id="metrics"></div>

      <div class="card">
        <div class="sec">조직번호 · 기증자번호 검색</div>
        <div class="search-wrap">
          <input class="sinput" id="sinput" type="text" maxlength="6" placeholder="예: 252001" oninput="onSearch(this)" onkeyup="render()">
          <span class="scnt" id="scnt">0/6</span>
        </div>
      </div>

      <div class="filter-sec">
        <button class="ftoggle" onclick="toggleFilter()">
          <span>필터 선택 <span class="badge" id="fbadge" style="display:none"></span></span>
          <span id="farrow" style="font-size:11px;color:#9a9a94">▼</span>
        </button>
        <div class="fbody" id="fbody">
          <div class="fgroup"><div class="fglabel">품목 구분</div><div class="chips" id="cType"></div></div>
          <div class="fgroup"><div class="fglabel">냉동고</div><div class="chips" id="cFridge"></div></div>
          <div class="fgroup"><div class="fglabel">유효기간</div><div class="chips" id="cExp"></div></div>
        </div>
      </div>

      <div id="searchResult"></div>

      <div class="card">
        <div class="sec">냉동고별 가동률 <span style="font-weight:400;color:#9a9a94">· 클릭하면 구역별 보관 내역</span></div>
        <div id="fridgeList"></div>
        <div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:#9a9a94;flex-wrap:wrap;align-items:center">
          <span><span class="dot" style="background:#D85A30"></span>뼈</span>
          <span><span class="dot" style="background:#D4537E"></span>피부</span>
          <span style="margin-left:auto">피부 Max 67,000 · 뼈 Max 10도너</span>
        </div>
      </div>

      <div class="card">
        <div class="sec">유효기간 분포 <span style="font-weight:400;color:#9a9a94">· 냉동고 보관 중인 재고 기준</span></div>
        <div id="expDist"></div>
      </div>

      <div class="card">
        <div class="sec">최근 처리 이력</div>
        <div id="history"></div>
      </div>
    </div>

    <div id="pageIntake" style="display:none">
      <div class="icard">
        <div class="istep"><span class="istep-num">1</span> 기증자번호 입력</div>
        <div class="search-wrap">
          <input class="sinput" id="iinput" type="text" maxlength="6" placeholder="예: 262478" oninput="onISearch(this)">
          <span class="scnt" id="iscnt">0/6</span>
        </div>
        <button class="btn-isearch" onclick="searchIntake()">검색</button>
      </div>
      <div class="icard" id="iResultCard" style="display:none">
        <div class="istep"><span class="istep-num">2</span> 입고 대상 확인</div>
        <div id="iItems"></div>
      </div>
      <div class="icard" id="iFridgeCard" style="display:none">
        <div class="istep"><span class="istep-num">3</span> 냉동고 선택</div>
        <div class="chips" id="iFridgeChips"></div>
        <div class="istep" style="margin-top:18px"><span class="istep-num">4</span> 보관 구역 입력 <span style="font-weight:400;font-size:10px">(선택)</span></div>
        <input class="zone-input" id="iZone" type="text" placeholder="예: 2구역, A-3">
        <button class="btn-intake" id="btnIntakeConfirm" onclick="confirmIntake()" disabled>입고 확인</button>
      </div>
    </div>

    <div id="pageOut" style="display:none">
      <div class="card">
        <div class="sec">기증자번호 여러 개 검색</div>
        <textarea class="multi" id="multiInput" placeholder="여러 개 붙여넣기&#10;예: 261191&#10;261192" oninput="renderOut()"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
          <button class="btn-copy" style="padding:6px 14px;font-size:12px" onclick="document.getElementById('multiInput').value='';renderOut()">초기화</button>
          <span id="multiCount" style="font-size:11px;color:#9a9a94"></span>
        </div>
      </div>
      <div id="outResult"></div>
    </div>

  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">출고 처리</div>
    <div id="modalBody"></div>
    <div class="modal-note" id="modalNote"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-confirm" id="btnConfirm" onclick="confirmRelease()">출고 확인</button>
    </div>
  </div>
</div>

<div class="detail" id="detail">
  <div class="dhead"><div><span class="dcode" id="dcode"></span><span class="dname" id="dname"></span></div><button class="dclose" onclick="closeDetail()">×</button></div>
  <div class="dgrid" id="dgrid"></div>
</div>

<script>
const SHEET_ID="1I7PREqlH4XFSZDdIBM9mEvyE7nQRzU3SeDlomqkVox0";
const GID="1504643023";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`;
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwn8lZR9lDaxdFnBclDDFe7uSmDiVYmeiqfGIS6tjbnzeqkiCOo4YxHNqm6RqC3Fzwb/exec";
const PW=new URLSearchParams(window.location.search).get("pw")||"";
const CAN_EDIT=PW!=="";
const SKIN_MAX=67000, BONE_MAX=10;
const FRIDGES=["D-0801","D-0805","D-0806","D-0808","D-0809","D-0810","D-0812","D-0813","D-0814","D-0815","D-0817"];
const BONE_C="#378ADD", SKIN_C="#EF9F27";

let ALL=[],STOCK=[],NOSTORED=[];
let selType=[],selFridge=[],selExp=[];
const EXP_OPTS=["만료","90일이내","정상"];
let filterOpen=false,openCard=null,releaseItem=null,openFridge=null;
let _list=[],_outList=[];

const TODAY=new Date();
function daysDiff(s){if(!s)return 9999;return Math.ceil((new Date(s)-TODAY)/86400000);}
function expStatus(s){const d=daysDiff(s);if(d<0)return{label:"만료",color:"#e24b4a"};if(d<=90)return{label:"90일이내",color:"#ef9f27"};return{label:"정상",color:"#639922"};}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function isSkinItem(r){return String(r["구분"]||"").includes("피부");}
function isBoneItem(r){return String(r["구분"]||"").includes("뼈");}
function parseArValue(r){if(!isSkinItem(r))return 0;const s=(r["규격1"]||"")+(r["규격2"]||"");const m=s.match(/Ar[:\s]*([\d,]+)/i);return m?parseInt(m[1].replace(/,/g,"")):0;}
function pctColor(p){if(p>=95)return"#e24b4a";if(p>=80)return"#ef9f27";if(p>=60)return"#BA7517";return"#639922";}
function pctPill(p){if(p>=95)return'<span class="pill p-danger">포화</span>';if(p>=80)return'<span class="pill p-warn">주의</span>';return'<span class="pill p-ok">여유</span>';}

function setTab(t){
  ['status','intake','out'].forEach(k=>{
    document.getElementById('tab'+(k==='status'?'Status':k==='intake'?'Intake':'Out')).classList.toggle('active',k===t);
    document.getElementById('page'+(k==='status'?'Status':k==='intake'?'Intake':'Out')).style.display=(k===t?'':'none');
  });
}

function loadData(){
  show("loading");hide("errbox");hide("dash");
  Papa.parse(CSV_URL+"&t="+Date.now(),{download:true,header:true,skipEmptyLines:true,
    complete:function(res){
      ALL=res.data;
      STOCK=ALL.filter(r=>(!r["출고일자"]||r["출고일자"].trim()==="")&&r["냉동고번호"]&&r["냉동고번호"].trim()!=="");
      NOSTORED=ALL.filter(r=>(!r["출고일자"]||r["출고일자"].trim()==="")&&(!r["냉동고번호"]||r["냉동고번호"].trim()===""));
      document.getElementById("updated").textContent=new Date().toLocaleTimeString("ko-KR")+" 기준";
      buildAll();hide("loading");show("dash");
    },
    error:function(e){document.getElementById("errmsg").textContent=e.message||"CSV 로드 실패";hide("loading");show("errbox");}
  });
}

function fridgeStat(fid){
  const rows=STOCK.filter(r=>String(r["냉동고번호"]||"").trim()===fid);
  const skinAr=rows.reduce((s,r)=>s+parseArValue(r),0);
  const skinPct=Math.min(100,Math.round(skinAr/SKIN_MAX*100));
  const boneDonors=new Set(rows.filter(isBoneItem).map(r=>String(r["기증자번호"]||"").trim()).filter(Boolean)).size;
  const bonePct=Math.min(100,Math.round(boneDonors/BONE_MAX*100));
  const mainPct=skinAr>0?skinPct:(boneDonors>0?bonePct:0);
  return{rows,skinAr,skinPct,boneDonors,bonePct,mainPct,expired:rows.filter(r=>daysDiff(r["유효기간"])<0).length};
}

function buildAll(){buildAlert();buildMetrics();buildFridgeList();buildExpDist();buildHistory();buildChips();render();renderOut();}

function buildAlert(){
  const full=FRIDGES.filter(f=>fridgeStat(f).mainPct>=95).length;
  const expired=STOCK.filter(r=>daysDiff(r["유효기간"])<0).length;
  const msgs=[];
  if(full>0)msgs.push(`냉동고 ${full}대 포화(95% 이상) — 신규 입고 여유 공간 부족`);
  if(expired>0)msgs.push(`유효기간 만료 ${expired}건 보관 중 — 폐기·재검토 필요`);
  const el=document.getElementById("alertBox");
  if(msgs.length===0){el.innerHTML=`<div class="alert ok"><div class="t">이상 없음</div>포화 냉동고와 만료 재고가 없습니다.</div>`;return;}
  el.innerHTML=`<div class="alert warn"><div class="t">주의 필요 ${msgs.length}건</div>${msgs.map(m=>"· "+m).join("<br>")}</div>`;
}

function buildMetrics(){
  const bone=STOCK.filter(isBoneItem), skin=STOCK.filter(isSkinItem);
  const boneDonors=new Set(bone.map(r=>String(r["기증자번호"]||"").trim()).filter(Boolean)).size;
  const skinAr=skin.reduce((s,r)=>s+parseArValue(r),0);
  const used=FRIDGES.filter(f=>fridgeStat(f).rows.length>0);
  const full=FRIDGES.filter(f=>fridgeStat(f).mainPct>=95).length;
  const avg=used.length?Math.round(used.reduce((s,f)=>s+fridgeStat(f).mainPct,0)/used.length):0;
  const boneSvg=`<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="${BONE_C}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20c-2 0-3.5 1.5-3.5 3.5S4 27 6 27c.8 0 1.5-.3 2-.7.5.5 1.2.7 2 .7 2 0 3.5-1.5 3.5-3.5 0-1.3-.7-2.4-1.8-3L20.7 12c.6 1.1 1.7 1.8 3 1.8 2 0 3.5-1.5 3.5-3.5S25.7 6.8 23.7 6.8c-.8 0-1.5.3-2 .7-.5-.5-1.2-.7-2-.7-2 0-3.5 1.5-3.5 3.5 0 1.3.7 2.4 1.8 3L9 22.3c-.6-1.1-1.7-1.8-3-1.8z"/></svg>`;
  const skinSvg=`<svg width="26" height="26" viewBox="0 0 32 32" fill="none" stroke="${SKIN_C}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="6" width="24" height="20" rx="3"/><path d="M4 12h24M4 18h24"/><circle cx="10" cy="22" r="1"/><circle cx="16" cy="22" r="1"/><circle cx="22" cy="22" r="1"/></svg>`;
  document.getElementById("metrics").innerHTML=`
  <div class="mc"><div class="ic" style="background:#f4f4f1"><span style="font-size:22px">📦</span></div>
    <div><div class="l">현재 보관 재고</div><div class="v">${STOCK.length}<span style="font-size:13px;color:#9a9a94">건</span></div><div class="s">냉동고 ${used.length}대 사용 중</div></div></div>
  <div class="mc"><div class="ic" style="background:#faece7">${boneSvg}</div>
    <div><div class="l">뼈 보관</div><div class="v">${bone.length}<span style="font-size:13px;color:#9a9a94">건</span></div><div class="s">기증자 ${boneDonors}명</div></div></div>
  <div class="mc"><div class="ic" style="background:#fbeaf0">${skinSvg}</div>
    <div><div class="l">피부 보관</div><div class="v">${skin.length}<span style="font-size:13px;color:#9a9a94">건</span></div><div class="s">Ar 합계 ${Math.round(skinAr/1000)}K</div></div></div>
  <div class="mc"><div class="ic" style="background:#fceaea"><span style="font-size:22px">🧊</span></div>
    <div><div class="l">평균 가동률</div><div class="v" style="color:${pctColor(avg)}">${avg}%</div><div class="s">${FRIDGES.length}대 중 ${full}대 포화</div></div></div>`;
}

function buildFridgeList(){
  document.getElementById("fridgeList").innerHTML=FRIDGES.map(fid=>{
    const st=fridgeStat(fid);
    const idle=st.rows.length===0;
    const safe=fid.replace(/[^a-zA-Z0-9]/g,'_');
    if(idle)return`<div class="frow idle"><span class="fid">${fid}</span><div class="bar"></div><span class="pct">—</span><span class="cnt">0건</span><span class="pill p-idle">비어있음</span><span class="arw"></span></div>`;
    const bw=st.boneDonors>0?Math.round(st.bonePct*(st.skinAr>0?0.5:1)):0;
    const sw=st.skinAr>0?Math.round(st.skinPct*(st.boneDonors>0?0.5:1)):0;
    return`<div class="frow" onclick="toggleFridgeDetail('${fid}')"><span class="fid">${fid}</span>
      <div class="bar">${sw?`<div style="width:${sw}%;background:${SKIN_C}"></div>`:""}${bw?`<div style="width:${bw}%;background:${BONE_C}"></div>`:""}</div>
      <span class="pct" style="color:${pctColor(st.mainPct)}">${st.mainPct}%</span>
      <span class="cnt">${st.rows.length}건</span>${pctPill(st.mainPct)}
      ${st.expired>0?`<span class="pill p-danger">만료 ${st.expired}</span>`:""}
      <span class="arw" id="arw_${safe}">▼</span></div>
      <div class="fdet" id="fd_${safe}"></div>`;
  }).join("");
}

function toggleFridgeDetail(fid){
  const safe=fid.replace(/[^a-zA-Z0-9]/g,'_');
  const box=document.getElementById('fd_'+safe), arw=document.getElementById('arw_'+safe);
  if(openFridge===fid){box.classList.remove('open');arw.textContent='▼';openFridge=null;return;}
  document.querySelectorAll('.fdet').forEach(e=>e.classList.remove('open'));
  document.querySelectorAll('.arw').forEach(e=>{if(e.textContent)e.textContent='▼';});
  const st=fridgeStat(fid);
  const zones=new Map();
  st.rows.forEach(r=>{const z=String(r["냉동고 보관 구역"]||"").trim()||"구역 미지정";if(!zones.has(z))zones.set(z,[]);zones.get(z).push(r);});
  const sorted=[...zones.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ko',{numeric:true}));
  box.innerHTML=`<div style="font-size:11px;color:#8a8a84;margin-bottom:9px">
      피부 ${st.skinPct}% (${Math.round(st.skinAr/1000)}K/67K) · 뼈 ${st.boneDonors}/${BONE_MAX}도너 · 총 ${st.rows.length}건</div>`+
    sorted.map(([z,rows])=>{
      const donors=new Map();
      rows.forEach(r=>{const d=String(r["기증자번호"]||"").trim()||"—";if(!donors.has(d))donors.set(d,[]);donors.get(d).push(r);});
      return`<div class="zone"><div class="zone-h"><span>${z}</span><span style="color:#9a9a94;font-weight:400">${rows.length}건</span></div>
      ${[...donors.entries()].map(([d,rs])=>{
        const r=rs[0], ex=expStatus(r["유효기간"]);
        const tag=isBoneItem(r)?'<span class="pill p-bone">뼈</span>':isSkinItem(r)?'<span class="pill p-skin">피부</span>':'';
        return`<div class="zrow"><span class="zd">${d}</span>${tag}<span class="zn">${r["품목명"]||"—"}</span>
          <span class="zc">${rs.length}건</span><span class="pill" style="background:${ex.color}22;color:${ex.color}">${ex.label}</span></div>`;
      }).join("")}</div>`;
    }).join("");
  box.classList.add('open');arw.textContent='▲';openFridge=fid;
}

function buildExpDist(){
  const e=STOCK.filter(r=>daysDiff(r["유효기간"])<0).length;
  const d30=STOCK.filter(r=>{const d=daysDiff(r["유효기간"]);return d>=0&&d<=30;}).length;
  const d90=STOCK.filter(r=>{const d=daysDiff(r["유효기간"]);return d>30&&d<=90;}).length;
  const ok=STOCK.length-e-d30-d90;
  const p=n=>STOCK.length?(n/STOCK.length*100):0;
  document.getElementById("expDist").innerHTML=`
  <div class="dist-bar">
    <div style="width:${p(e)}%;background:#e24b4a"></div><div style="width:${p(d30)}%;background:#ef9f27"></div>
    <div style="width:${p(d90)}%;background:#FAC775"></div><div style="width:${p(ok)}%;background:#639922"></div></div>
  <div class="dist-row"><span><span class="dot" style="background:#e24b4a"></span>만료</span><strong style="color:#a32d2d">${e}건</strong></div>
  <div class="dist-row"><span><span class="dot" style="background:#ef9f27"></span>30일 이내</span><strong style="color:#854f0b">${d30}건</strong></div>
  <div class="dist-row"><span><span class="dot" style="background:#FAC775"></span>90일 이내</span><strong>${d90}건</strong></div>
  <div class="dist-row"><span><span class="dot" style="background:#639922"></span>정상</span><strong>${ok}건</strong></div>`;
}

function buildHistory(){
  const out=ALL.filter(r=>r["출고일자"]&&r["출고일자"].trim()!=="");
  const map=new Map();
  out.forEach(r=>{
    const k=String(r["기증자번호"]||"").trim()+"|"+r["출고일자"];
    if(!map.has(k))map.set(k,{donor:String(r["기증자번호"]||"").trim(),date:r["출고일자"],who:r["비고"]||"",rows:[]});
    map.get(k).rows.push(r);
  });
  const list=[...map.values()].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,8);
  if(!list.length){document.getElementById("history").innerHTML=`<div style="color:#b4b2a9;font-size:13px;padding:8px 0">출고 이력이 없습니다</div>`;return;}
  document.getElementById("history").innerHTML=list.map(h=>{
    const r=h.rows[0];
    const tag=isBoneItem(r)?'<span class="pill p-bone">뼈</span>':isSkinItem(r)?'<span class="pill p-skin">피부</span>':'';
    return`<div class="hrow"><span class="pill p-out">출고</span><span class="hcode">${h.donor||"—"}</span>${tag}
      <span class="hmid">${r["품목명"]||"—"} · ${h.rows.length}건</span><span class="hdate">${h.date} ${h.who}</span></div>`;
  }).join("");
}

function buildChips(){
  const types=[...new Set(STOCK.map(r=>r["품목구분"]).filter(Boolean))];
  const used=FRIDGES.filter(f=>fridgeStat(f).rows.length>0);
  rc("cType",["전체",...types],selType,"#378ADD",toggleType);
  rc("cFridge",["전체",...used],selFridge,"#7F77DD",toggleFridge2);
  rc("cExp",["전체",...EXP_OPTS],selExp,"#1D9E75",toggleExp);
  const n=selType.length+selFridge.length+selExp.length;
  const b=document.getElementById("fbadge");b.style.display=n>0?"inline":"none";b.textContent=n+"개";
}
function rc(id,opts,sel,color,fn){
  document.getElementById(id).innerHTML=opts.map(o=>{
    const on=o==="전체"?sel.length===0:sel.includes(o);
    return`<button class="chip${on?" on":""}" style="${on?`background:${color};border-color:${color}`:""}" onclick="${fn.name}('${o}')">${o}</button>`;
  }).join("");
}
function toggleType(v){tog(selType,v);buildChips();render();}
function toggleFridge2(v){tog(selFridge,v);buildChips();render();}
function toggleExp(v){tog(selExp,v);buildChips();render();}
function tog(a,v){if(v==="전체"){a.length=0;return;}const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);}
function toggleFilter(){filterOpen=!filterOpen;document.getElementById("fbody").classList.toggle("open",filterOpen);document.getElementById("farrow").textContent=filterOpen?"▲":"▼";}

function onSearch(el){el.value=el.value.replace(/\D/g,"").slice(0,6);const c=document.getElementById("scnt");c.textContent=el.value.length+"/6";c.className="scnt"+(el.value.length===6?" on":"");}
function onIS(el,id){el.value=el.value.replace(/\D/g,"").slice(0,6);const c=document.getElementById(id);c.textContent=el.value.length+"/6";c.className="scnt"+(el.value.length===6?" on":"");}
function getMultiCodes(){return[...new Set(document.getElementById("multiInput").value.split(/[\n,\s]+/).map(s=>s.replace(/\D/g,"").trim()).filter(s=>s.length>=4))];}
function groupByDonor(rows){const m=new Map();rows.forEach(r=>{const d=String(r["기증자번호"]||"").trim();if(!m.has(d))m.set(d,[]);m.get(d).push(r);});return[...m.values()];}

function cardHtml(group,i,showRelease,prefix){
  const r=group[0],ex=expStatus(r["유효기간"]),d=daysDiff(r["유효기간"]);
  const donor=String(r["기증자번호"]||"").trim()||String(r["조직번호"]||"").slice(0,6);
  const floor=String(r["냉동고 보관 구역"]||"").trim();
  const tag=isBoneItem(r)?'<span class="pill p-bone">뼈</span>':isSkinItem(r)?'<span class="pill p-skin">피부</span>':'';
  return`<div class="rcard" style="border-left-color:${ex.color}" id="${prefix}${i}" onclick="toggleCard(${i},'${prefix}')">
    <div class="codebadge">${donor||"—"}</div>
    <div class="iinfo"><div class="iname">${tag} ${r["품목명"]||"—"}</div><div class="isub">${r["품목구분"]||""} ${r["규격1"]?"· "+r["규격1"]:""}</div></div>
    ${r["냉동고번호"]?`<div class="locbadge"><div class="loclabel">냉동고</div><div class="locval">${r["냉동고번호"]}</div>${floor?`<div class="locfloor">${floor}</div>`:""}</div>`:""}
    ${group.length>1?`<div class="locbadge"><div class="loclabel">수량</div><div class="locval" style="color:#534AB7">${group.length}건</div></div>`:""}
    <div class="expbadge"><span class="pill" style="background:${ex.color}22;color:${ex.color}">${ex.label}</span>
      <span class="expdays">${d<0?Math.abs(d)+"일 초과":d+"일 남음"}</span><span class="expdate">${r["유효기간"]||""}</span></div>
    <div style="display:flex;gap:6px" onclick="event.stopPropagation()">
      <button class="btn-copy" onclick="copyCode('${donor}',event)">📋</button>
      ${showRelease&&CAN_EDIT?`<button class="btn-release" onclick="openRelease(${i},event)">출고</button>`:""}
    </div></div>`;
}

function render(){
  const code=document.getElementById("sinput").value.trim();
  const hasF=code||selType.length||selFridge.length||selExp.length;
  const box=document.getElementById("searchResult");
  if(!hasF){box.innerHTML="";_list=[];return;}
  const filtered=STOCK.filter(r=>{
    if(code){const org=String(r["조직번호"]||"").trim(),donor=String(r["기증자번호"]||"").trim();
      if(!org.startsWith(code)&&donor!==code)return false;}
    if(selType.length&&!selType.includes(r["품목구분"]))return false;
    if(selFridge.length&&!selFridge.includes(String(r["냉동고번호"]||"").trim()))return false;
    if(selExp.length&&!selExp.includes(expStatus(r["유효기간"]).label))return false;
    return true;});
  const groups=groupByDonor(filtered);
  _list=groups;
  if(!groups.length){box.innerHTML=`<div class="card"><div class="empty">조건에 맞는 조직이 없습니다</div></div>`;return;}
  const locs=[...new Set(filtered.map(r=>r["냉동고번호"]).filter(Boolean))].sort();
  box.innerHTML=`<div class="card"><div class="sec" style="display:flex;justify-content:space-between">
    <span><strong style="color:#185fa5;font-size:14px">${groups.length}건</strong> 검색됨</span><span style="font-weight:400;color:#9a9a94">${locs.join(" · ")}</span></div>
    <div class="rlist">${groups.map((g,i)=>cardHtml(g,i,false,"rc")).join("")}</div></div>`;
}

function renderOut(){
  const codes=getMultiCodes();
  document.getElementById("multiCount").textContent=codes.length?`${codes.length}개 코드 입력됨`:"";
  const box=document.getElementById("outResult");
  if(!codes.length){box.innerHTML=`<div class="hint-box">기증자번호를 입력하면<br>출고 대상이 표시됩니다</div>`;_outList=[];return;}
  const filtered=STOCK.filter(r=>{const donor=String(r["기증자번호"]||"").trim(),org=String(r["조직번호"]||"").trim();
    return codes.some(c=>org.startsWith(c)||donor===c);});
  const groups=groupByDonor(filtered);_outList=groups;
  if(!groups.length){box.innerHTML=`<div class="card"><div class="empty">보관 중인 조직이 없습니다</div></div>`;return;}
  box.innerHTML=`<div class="card"><div class="sec"><strong style="color:#185fa5;font-size:14px">${groups.length}건</strong> 검색됨
    ${CAN_EDIT?"":' <span class="pill p-idle">보기 전용 · 출고 불가</span>'}</div>
    <div class="rlist">${groups.map((g,i)=>cardHtml(g,i,true,"oc")).join("")}</div></div>`;
}

function copyCode(code,e){
  e.stopPropagation();const btn=e.currentTarget;
  const ok=()=>{btn.textContent="✓";btn.classList.add("copied");setTimeout(()=>{btn.textContent="📋";btn.classList.remove("copied");},1200);};
  if(navigator.clipboard)navigator.clipboard.writeText(code).then(ok).catch(()=>fbCopy(code,ok));else fbCopy(code,ok);
}
function fbCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb();}

function toggleCard(i,prefix){
  const list=prefix==="oc"?_outList:_list;
  if(openCard===prefix+i){closeDetail();return;}
  openCard=prefix+i;
  const group=list[i],r=group[0];
  document.getElementById("dcode").textContent=String(r["기증자번호"]||r["조직번호"]||"").slice(0,6)||"—";
  document.getElementById("dname").textContent=r["품목명"]||"";
  const f=[["냉동고",r["냉동고번호"]||"—"],["보관구역",String(r["냉동고 보관 구역"]||"").trim()||"—"],["수량",group.length+"건"],
    ["품목구분",r["품목구분"]||"—"],["규격",`${r["규격1"]||""} ${r["규격2"]||""}`.trim()||"—"],["입고일",r["입고일자"]||"—"],
    ["유효기간",r["유효기간"]||"—"],["기증자번호",r["기증자번호"]||"—"],["바코드",r["바코드번호"]||"—"]];
  document.getElementById("dgrid").innerHTML=f.map(([k,v])=>`<div class="ditem"><div class="dlabel">${k}</div><div class="dval">${v}</div></div>`).join("");
  document.getElementById("detail").classList.add("open");
}
function closeDetail(){openCard=null;document.getElementById("detail").classList.remove("open");}

function openRelease(i,e){
  e.stopPropagation();
  const group=_outList[i],r=group[0];
  releaseItem={donor:String(r["기증자번호"]||"").trim(),count:group.length};
  const floor=String(r["냉동고 보관 구역"]||"").trim(),today=todayStr();
  document.getElementById("modalBody").innerHTML=`
    <div class="mitem"><span>기증자번호</span><strong style="color:#185fa5;font-family:monospace;font-size:15px">${releaseItem.donor||"—"}</strong></div>
    <div class="mitem"><span>품목명</span><strong>${r["품목명"]||"—"}</strong></div>
    <div class="mitem"><span>냉동고</span><strong style="color:#854f0b">${r["냉동고번호"]||"—"}${floor?" · "+floor:""}</strong></div>
    <div class="mitem"><span>출고 수량</span><strong style="color:#534AB7">${group.length}건 (전체)</strong></div>
    <div class="mitem"><span>출고일자</span><strong style="color:#3b6d11">${today}</strong></div>
    <div class="mitem"><span>비고</span><strong>이다빈</strong></div>`;
  document.getElementById("modalNote").textContent=`기증자번호 ${releaseItem.donor}의 ${group.length}건이 모두 출고 처리됩니다.`;
  document.getElementById("btnConfirm").disabled=false;
  document.getElementById("modalOverlay").style.display="flex";
}
function closeModal(){document.getElementById("modalOverlay").style.display="none";releaseItem=null;const b=document.getElementById("btnConfirm");b.disabled=false;b.textContent="출고 확인";}

async function confirmRelease(){
  if(!releaseItem)return;
  const donor=releaseItem.donor,btn=document.getElementById("btnConfirm"),today=todayStr();
  btn.disabled=true;btn.textContent="처리 중...";
  try{
    const url=`${APPS_SCRIPT_URL}?donorCode=${encodeURIComponent(donor)}&date=${encodeURIComponent(today)}&t=${Date.now()}&pw=${encodeURIComponent(PW)}`;
    const res=await fetch(url,{redirect:'follow'});const data=await res.json();
    if(data.success){closeModal();alert(`출고 완료\n기증자번호: ${donor}\n출고일자: ${today}\n처리: ${data.updated}건`);setTimeout(loadData,1500);}
    else{alert("출고 실패: "+(data.error||"알 수 없는 오류"));btn.disabled=false;btn.textContent="출고 확인";}
  }catch(err){alert("연결 실패\n"+err.message);btn.disabled=false;btn.textContent="출고 확인";}
}

let iSelectedFridge='',iFoundGroups=[];
function onISearch(el){onIS(el,'iscnt');if(el.value.length===6)searchIntake();}
function searchIntake(){
  const code=document.getElementById('iinput').value.trim();
  if(!code||code.length<4){alert('기증자번호를 입력해주세요');return;}
  const matched=NOSTORED.filter(r=>{const d=String(r["기증자번호"]||"").trim(),o=String(r["조직번호"]||"").trim();return d===code||o.startsWith(code);});
  iFoundGroups=groupByDonor(matched);
  const rcd=document.getElementById('iResultCard'),fcd=document.getElementById('iFridgeCard');
  if(!iFoundGroups.length){
    document.getElementById('iItems').innerHTML=`<div class="empty" style="padding:16px">냉동고 미배정 건이 없습니다</div>`;
    rcd.style.display='';fcd.style.display='none';return;}
  document.getElementById('iItems').innerHTML=iFoundGroups.map(g=>{
    const r=g[0],donor=String(r["기증자번호"]||"").trim(),ex=expStatus(r["유효기간"]);
    const tag=isBoneItem(r)?'<span class="itag" style="background:#faece7;color:#993c1d">뼈</span>':isSkinItem(r)?'<span class="itag" style="background:#fbeaf0;color:#993556">피부</span>':'';
    return`<div class="iresult"><div class="idonor">${donor}</div><div class="iname2">${r["품목명"]||"—"}</div>
      <div class="isub2">${r["품목구분"]||""} ${r["규격1"]?"· "+r["규격1"]:""}</div>${tag}
      <span class="itag" style="background:${ex.color}22;color:${ex.color}">${ex.label}</span>
      <span class="itag" style="background:#e6f1fb;color:#185fa5">${g.length}건</span></div>`;}).join('');
  rcd.style.display='';
  if(CAN_EDIT){buildIFridgeChips();fcd.style.display='';}else fcd.style.display='none';
}
function buildIFridgeChips(){
  iSelectedFridge='';document.getElementById('btnIntakeConfirm').disabled=true;
  document.getElementById('iFridgeChips').innerHTML=FRIDGES.map(f=>{
    const st=fridgeStat(f),safe=f.replace(/[^a-zA-Z0-9]/g,'_');
    const sub=st.rows.length?`${st.mainPct}%`:'비어있음';
    return`<button class="fchip" id="ifchip_${safe}" onclick="selectIFridge('${f}')">${f} <span style="font-weight:400;font-size:11px;color:${st.mainPct>=95?'#a32d2d':'#9a9a94'}">${sub}</span></button>`;
  }).join('');
}
function selectIFridge(f){
  iSelectedFridge=f;
  document.querySelectorAll('.fchip').forEach(e=>e.classList.remove('on'));
  document.getElementById('ifchip_'+f.replace(/[^a-zA-Z0-9]/g,'_'))?.classList.add('on');
  document.getElementById('btnIntakeConfirm').disabled=false;
}
async function confirmIntake(){
  if(!iSelectedFridge||!iFoundGroups.length)return;
  const donor=String(iFoundGroups[0][0]["기증자번호"]||"").trim();
  const zone=document.getElementById('iZone').value.trim();
  const btn=document.getElementById('btnIntakeConfirm');
  btn.disabled=true;btn.textContent='처리 중...';
  try{
    const url=`${APPS_SCRIPT_URL}?donorCode=${encodeURIComponent(donor)}&fridge=${encodeURIComponent(iSelectedFridge)}&zone=${encodeURIComponent(zone)}&t=${Date.now()}&pw=${encodeURIComponent(PW)}`;
    const res=await fetch(url,{redirect:'follow'});const data=await res.json();
    if(data.success){
      alert(`입고 완료\n기증자번호: ${donor}\n냉동고: ${iSelectedFridge}${zone?"\n보관구역: "+zone:""}\n처리: ${data.updated}건`);
      document.getElementById('iinput').value='';document.getElementById('iscnt').textContent='0/6';
      document.getElementById('iZone').value='';document.getElementById('iResultCard').style.display='none';
      document.getElementById('iFridgeCard').style.display='none';
      iFoundGroups=[];iSelectedFridge='';setTimeout(loadData,1500);
    }else{alert('입고 실패: '+(data.error||'알 수 없는 오류'));btn.disabled=false;btn.textContent='입고 확인';}
  }catch(err){alert('연결 실패\n'+err.message);btn.disabled=false;btn.textContent='입고 확인';}
}

function initMode(){
  const t=document.getElementById('modeTag');
  if(CAN_EDIT){t.textContent='편집 모드';t.className='mode-tag mode-edit';}
  else{t.textContent='보기 전용';t.className='mode-tag mode-view';}
}
function show(id){document.getElementById(id).style.display='';}
function hide(id){document.getElementById(id).style.display='none';}
initMode();loadData();
</script>
</body>
</html>
